name: svc-calc

on:
  push:
    branches: [main]
    paths:
      - 'svc-calc/**'
      - 'calc-lib/**'
  pull_request:
    paths:
      - 'svc-calc/**'
      - 'calc-lib/**'

jobs:
  # Se calc-lib mudou, builda ela primeiro
  build-calc-lib:
    runs-on: ubuntu-latest
    outputs:
      jar-uploaded: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if calc-lib changed
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^calc-lib/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 17
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven
        if: steps.check.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-calc-lib-${{ hashFiles('calc-lib/pom.xml') }}

      - name: Build and test calc-lib
        if: steps.check.outputs.changed == 'true'
        run: mvn clean install -B
        working-directory: calc-lib

      - name: Upload calc-lib JAR
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calc-lib-jar
          path: calc-lib/target/calc-lib-*.jar
          retention-days: 7

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-calc-lib
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-svc-calc-${{ hashFiles('svc-calc/pom.xml') }}

      # Baixa o JAR da lib se foi publicado neste run
      - name: Download calc-lib JAR
        if: needs.build-calc-lib.outputs.jar-uploaded == 'true'
        uses: actions/download-artifact@v4
        with:
          name: calc-lib-jar
          path: /tmp/calc-lib-jar

      - name: Install calc-lib into local .m2
        if: needs.build-calc-lib.outputs.jar-uploaded == 'true'
        run: |
          mvn install:install-file \
            -Dfile=$(ls /tmp/calc-lib-jar/calc-lib-*.jar | grep -v sources) \
            -DgroupId=com.vmetrix \
            -DartifactId=calc-lib \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -B

      - name: Prepare .m2 for Docker build
        run: |
          mkdir -p svc-calc/.m2/repository/com/vmetrix/calc-lib/1.0.0
          cp ~/.m2/repository/com/vmetrix/calc-lib/1.0.0/* \
            svc-calc/.m2/repository/com/vmetrix/calc-lib/1.0.0/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: svc-calc
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/svc-calc:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/svc-calc:latest

      - name: Update image tag in GitOps manifest
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i "s|newTag: .*  # svc-calc|newTag: ${{ github.sha }}  # svc-calc|" \
            gitops/overlays/production/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gitops/overlays/production/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update svc-calc image to ${{ github.sha }}"
          git push
