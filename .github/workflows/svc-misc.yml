name: svc-misc

on:
  push:
    branches: [main]
    paths:
      - 'svc-misc/**'
      - 'misc-utils/**'
  pull_request:
    paths:
      - 'svc-misc/**'
      - 'misc-utils/**'

jobs:
  build-misc-utils:
    runs-on: ubuntu-latest
    outputs:
      jar-uploaded: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if misc-utils changed
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^misc-utils/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 17
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build and test misc-utils
        if: steps.check.outputs.changed == 'true'
        run: mvn clean install -B
        working-directory: misc-utils

      - name: Upload misc-utils JAR
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: misc-utils-jar
          path: misc-utils/target/misc-utils-*.jar
          retention-days: 7

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-misc-utils
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-svc-misc-${{ hashFiles('svc-misc/pom.xml') }}

      - name: Download misc-utils JAR
        if: needs.build-misc-utils.outputs.jar-uploaded == 'true'
        uses: actions/download-artifact@v4
        with:
          name: misc-utils-jar
          path: /tmp/misc-utils-jar

      - name: Install misc-utils into local .m2
        if: needs.build-misc-utils.outputs.jar-uploaded == 'true'
        run: |
          mvn install:install-file \
            -Dfile=$(ls /tmp/misc-utils-jar/misc-utils-*.jar | grep -v sources) \
            -DgroupId=com.vmetrix \
            -DartifactId=misc-utils \
            -Dversion=1.0.0 \
            -Dpackaging=jar -B

      - name: Prepare .m2 for Docker build
        run: |
          mkdir -p svc-misc/.m2/repository/com/vmetrix/misc-utils/1.0.0
          cp ~/.m2/repository/com/vmetrix/misc-utils/1.0.0/* \
            svc-misc/.m2/repository/com/vmetrix/misc-utils/1.0.0/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: svc-misc
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/svc-misc:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/svc-misc:latest

      - name: Update image tag in GitOps manifest
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i "s|newTag: .*  # svc-misc|newTag: ${{ github.sha }}  # svc-misc|" \
            gitops/overlays/production/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GHCR_TOKEN }}@github.com/${{ github.repository }}
          git add gitops/overlays/production/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update svc-misc image to ${{ github.sha }}"
          git push
