name: web-app

on:
  push:
    branches: [main]
    paths:
      - 'web-app/**'
      - 'calc-lib/**'
      - 'misc-utils/**'
  pull_request:
    paths:
      - 'web-app/**'
      - 'calc-lib/**'
      - 'misc-utils/**'

permissions:
  contents: write
  packages: write

jobs:
  build-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build calc-lib
        run: mvn clean install -B
        working-directory: calc-lib

      - name: Build misc-utils
        run: mvn clean install -B
        working-directory: misc-utils

      - name: Upload calc-lib JAR
        uses: actions/upload-artifact@v4
        with:
          name: calc-lib-jar
          path: calc-lib/target/calc-lib-*.jar
          retention-days: 7

      - name: Upload misc-utils JAR
        uses: actions/upload-artifact@v4
        with:
          name: misc-utils-jar
          path: misc-utils/target/misc-utils-*.jar
          retention-days: 7

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-libs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-web-app-${{ hashFiles('web-app/pom.xml') }}

      - name: Download calc-lib JAR
        uses: actions/download-artifact@v4
        with:
          name: calc-lib-jar
          path: /tmp/calc-lib-jar

      - name: Download misc-utils JAR
        uses: actions/download-artifact@v4
        with:
          name: misc-utils-jar
          path: /tmp/misc-utils-jar

      - name: Install libs into local .m2
        run: |
          mvn install:install-file \
            -Dfile=$(ls /tmp/calc-lib-jar/calc-lib-*.jar | grep -v sources) \
            -DgroupId=com.vmetrix -DartifactId=calc-lib \
            -Dversion=1.0.0 -Dpackaging=jar -B
          mvn install:install-file \
            -Dfile=$(ls /tmp/misc-utils-jar/misc-utils-*.jar | grep -v sources) \
            -DgroupId=com.vmetrix -DartifactId=misc-utils \
            -Dversion=1.0.0 -Dpackaging=jar -B

      - name: Prepare .m2 for Docker build
        run: |
          mkdir -p web-app/.m2/repository/com/vmetrix/calc-lib/1.0.0
          mkdir -p web-app/.m2/repository/com/vmetrix/misc-utils/1.0.0
          cp ~/.m2/repository/com/vmetrix/calc-lib/1.0.0/* \
            web-app/.m2/repository/com/vmetrix/calc-lib/1.0.0/
          cp ~/.m2/repository/com/vmetrix/misc-utils/1.0.0/* \
            web-app/.m2/repository/com/vmetrix/misc-utils/1.0.0/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: web-app
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/web-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/web-app:latest

      - name: Update image tag in GitOps manifest
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i "s|newTag: .*  # web-app|newTag: ${{ github.sha }}  # web-app|" \
            gitops/overlays/production/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add gitops/overlays/production/kustomization.yaml
          git diff --staged --quiet || (git commit -m "ci: update web-app image to ${{ github.sha }}" && git pull --rebase && git push)
