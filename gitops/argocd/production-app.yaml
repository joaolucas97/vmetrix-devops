apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vmetrix-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joaolucas97/vmetrix-devops.git
    targetRevision: main
    path: gitops/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
