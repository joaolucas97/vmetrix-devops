apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-misc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-misc
  template:
    metadata:
      labels:
        app: svc-misc
    spec:
      containers:
        - name: svc-misc
          image: vmetrix/svc-misc:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: svc-misc
spec:
  selector:
    app: svc-misc
  ports:
    - port: 8081
      targetPort: 8081
